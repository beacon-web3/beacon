[project]
name = "beacon-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "cryptography==46.0.3",
    "Django==5.2.15",
    "django-allauth==65.13.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "drf-spectacular==0.29.0",
    "djangorestframework==3.17.1",
    "inflection==0.5.1",
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "psycopg[binary]==3.3.4",
    "PyJWT==2.10.1",
    "PyYAML==6.0.3",
    "referencing==0.37.0",
    "requests==2.32.5",
    "rpds-py==0.30.0",
    "sqlparse==0.5.5",
    "typing_extensions==4.15.0",
    "uritemplate==4.2.0",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "factory_boy==3.3.3",
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "ruff==0.15.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "beacon_api.settings"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
