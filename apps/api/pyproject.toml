[project]
name = "beacon-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "beacon_api.settings"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
