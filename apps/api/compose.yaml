name: beacon-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://beacon:beacon@postgres:5432/beacon_dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beacon_dev
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
    ports:
      - "5432:5432"
    volumes:
      - beacon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  beacon_postgres_data:
